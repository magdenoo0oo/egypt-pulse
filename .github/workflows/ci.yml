name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx tsx scripts/check-i18n.ts
      - run: npm run build
