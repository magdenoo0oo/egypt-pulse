name: daily-data

# Six runs a day (every 4 hours) so a delayed or dropped cron never costs a day. Every run is real work:
# it fetches the latest rates, heals any missed days from the last week, and records the check in data/meta.json.
# The source only publishes one new day, so runs after the first of the day are heartbeats: more would just be noise.
# A second trigger (Vercel Cron -> /api/cron/revive) re-enables and restarts this workflow if GitHub ever pauses it.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # lets the job re-enable its own schedule (GitHub pauses idle ones)

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect rates (also fills any day missed in the last week)
        run: npx tsx scripts/collect.ts --backfill 7
      - name: Commit and push data
        run: |
          git config user.name  "magdenoo0oo"
          git config user.email "195882873+magdenoo0oo@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: $(date -u +'%F %H:%MZ')"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase -q && git push -q; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable daily.yml || true
