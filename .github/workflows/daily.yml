name: daily-data

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect today's rates
        run: npx tsx scripts/collect.ts
      - name: Commit data
        run: |
          git config user.name  "magdenoo0oo"
          git config user.email "195882873+magdenoo0oo@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "data: $(date -u +%F)"
          git push
